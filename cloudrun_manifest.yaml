apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: adk-a2a-spiffe-agent
  namespace: default
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
    agentgateway.cloud.google.com/mesh: "default"
    agentgateway.cloud.google.com/auth-provider: "projects/${PROJECT_ID}/locations/${LOCATION}/authProviders/${AUTH_PROVIDER_NAME}"
    agentidentity.cloud.google.com/identity-type: "AGENT_IDENTITY"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        agentidentity.cloud.google.com/spiffe-id: "principal://agents.global.org-${AGENT_ORG_ID}.system.id.goog/resources/cloudrun/projects/${PROJECT_NUMBER}/locations/${LOCATION}/services/adk-a2a-spiffe-agent"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - name: agent-runtime
        image: gcr.io/${PROJECT_ID}/adk-a2a-spiffe-agent:latest
        ports:
        - name: http1
          containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "${PROJECT_ID}"
        - name: GOOGLE_CLOUD_LOCATION
          value: "${LOCATION}"
        - name: AUTH_PROVIDER_NAME
          value: "${AUTH_PROVIDER_NAME}"
        - name: AGENT_ORG_ID
          value: "${AGENT_ORG_ID}"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
