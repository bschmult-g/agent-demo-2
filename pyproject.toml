[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-a2a-spiffe-agent"
version = "1.0.0"
description = "Google ADK Agent with A2A Protocol, Ambient SPIFFE Agent Identity, and 3LO Agent Auth Manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[a2a,agent-identity]>=2.7.0",
    "a2a-sdk>=0.3.4",
    "uvicorn>=0.23.0",
    "starlette>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.148.0",
    "google-genai>=1.0.0",
    "google-auth>=2.25.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
